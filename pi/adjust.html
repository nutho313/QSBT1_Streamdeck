<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Adjust Parameter</title>
  <link rel="stylesheet" href="sdpi.css"/>
</head>
<body>
  <div class="sdpi-wrapper">

    <div class="sdpi-heading">Tune Parameter</div>
    <div type="field" class="sdpi-item">
      <div class="sdpi-item-label">Tune Name</div>
      <select class="sdpi-item-value" id="tuneName"></select>
    </div>
    <div type="field" class="sdpi-item">
      <div class="sdpi-item-label">Parameter</div>
      <select class="sdpi-item-value" id="paramLabel"></select>
    </div>

  </div>

  <script>
    var websocket, uuid, actionInfo, settings = {};

    function connectElgatoStreamDeckSocket(port, pluginUUID, registerEvent, info, actionInfo_) {
      uuid       = pluginUUID;
      actionInfo = JSON.parse(actionInfo_);
      settings   = actionInfo.payload.settings || {};
      websocket  = new WebSocket('ws://127.0.0.1:' + port);
      websocket.onopen = () => {
        websocket.send(JSON.stringify({ event: registerEvent, uuid }));
        loadSettings();
      };
    }

    const catalog = [
      {tune:"Braking",group:12,param:"Gain",idx:0,min:0,max:2.5,step:0.1},
      {tune:"Braking",group:12,param:"Sharpness",idx:1,min:0.1,max:2.5,step:0.1},
      {tune:"Braking",group:12,param:"Deadzone",idx:2,min:0,max:2.5,step:0.1},
      {tune:"Acceleration",group:12,param:"Gain",idx:0,min:0,max:2.5,step:0.1},
      {tune:"Acceleration",group:12,param:"Sharpness",idx:1,min:0.1,max:2.5,step:0.1},
      {tune:"Acceleration",group:12,param:"Deadzone",idx:2,min:0,max:2.5,step:0.1},
      {tune:"Sideways Acceleration",group:12,param:"Gain",idx:0,min:-2.5,max:2.5,step:0.1},
      {tune:"Sideways Acceleration",group:12,param:"Sharpness",idx:1,min:0.1,max:2.5,step:0.1},
      {tune:"Sideways Acceleration",group:12,param:"Deadzone",idx:2,min:0,max:2.5,step:0.1},
      {tune:"Centrifugal Force",group:12,param:"Gain",idx:0,min:-2.5,max:2.5,step:0.1},
      {tune:"Centrifugal Force",group:12,param:"Sharpness",idx:1,min:0.1,max:2.5,step:0.1},
      {tune:"Centrifugal Force",group:12,param:"Deadzone",idx:2,min:0,max:2.5,step:0.1},
      {tune:"Bounds",group:12,param:"Neutral",idx:0,min:0,max:30,step:1},
      {tune:"Bounds",group:12,param:"Maximum",idx:1,min:50,max:100,step:1},
      {tune:"Vertical G-Force",group:12,param:"Gain",idx:0,min:-2.5,max:2.5,step:0.1},
      {tune:"Vertical G-Force",group:12,param:"Sharpness",idx:1,min:0,max:2.5,step:0.1},
      {tune:"Side Slip",group:12,param:"Threshold",idx:0,min:0,max:60,step:0.5},
      {tune:"Side Slip",group:12,param:"Frequency",idx:1,min:0,max:50,step:1},
      {tune:"Side Slip",group:12,param:"Intensity",idx:2,min:0,max:2.5,step:0.1},
      {tune:"Road Harshness",group:12,param:"Gain",idx:0,min:0,max:2.5,step:0.1},
      {tune:"Road Harshness",group:12,param:"Sharpness",idx:1,min:0,max:2.5,step:0.1},
      {tune:"Pre-Impact Protection",group:12,param:"Long.",idx:0,min:4,max:100,step:1},
      {tune:"Pre-Impact Protection",group:12,param:"Lateral",idx:1,min:4,max:100,step:1},
      {tune:"Pre-Impact Protection",group:12,param:"Duration",idx:2,min:0,max:2000,step:10},
      {tune:"Violent Movement Threshold",group:2,param:"Threshold",idx:0,min:4,max:100,step:1},
      {tune:"Violent Movement Suppression Time",group:2,param:"Duration",idx:0,min:1,max:7,step:1},
      {tune:"Rev Limiter",group:17,param:"Frequency",idx:0,min:2,max:50,step:1},
      {tune:"Rev Limiter",group:17,param:"Intensity",idx:1,min:0,max:2.5,step:0.1},
      {tune:"Gear Change Effect",group:17,param:"Duration",idx:0,min:20,max:250,step:5},
      {tune:"Gear Change Effect",group:17,param:"Downshift",idx:1,min:0,max:2.5,step:0.1},
      {tune:"Gear Change Effect",group:17,param:"Upshift",idx:2,min:0,max:2.5,step:0.1},
      {tune:"ABS Active",group:17,param:"Frequency",idx:0,min:2,max:50,step:1},
      {tune:"ABS Active",group:17,param:"Intensity",idx:1,min:0,max:2.5,step:0.1},
    ];

    function getUniqueTunes() { return [...new Set(catalog.map(c => c.tune))]; }
    function getParamsForTune(tune) { return catalog.filter(c => c.tune === tune); }

    function populateTunes() {
      const sel = document.getElementById('tuneName');
      sel.innerHTML = '';
      getUniqueTunes().forEach(t => {
        const o = document.createElement('option');
        o.value = t; o.text = t;
        if (t === settings.TuneName) o.selected = true;
        sel.appendChild(o);
      });
      populateParams();
    }

    function populateParams() {
      const tune = document.getElementById('tuneName').value;
      const sel  = document.getElementById('paramLabel');
      sel.innerHTML = '';
      getParamsForTune(tune).forEach(p => {
        const o = document.createElement('option');
        o.value = p.param; o.text = p.param;
        if (p.param === settings.ParamLabel) o.selected = true;
        sel.appendChild(o);
      });
    }

    function loadSettings() {
      populateTunes();
    }

    function saveSettings() {
      const tune  = document.getElementById('tuneName').value;
      const param = document.getElementById('paramLabel').value;
      const entry = catalog.find(c => c.tune === tune && c.param === param) || {};
      const s = {
        IpAddress:  settings.IpAddress  || '192.168.8.131',
        Port:       settings.Port       || 8081,
        ProfileId:  settings.ProfileId  || 276,
        TuneName:   tune,
        TuneGroup:  entry.group  || 12,
        ParamLabel: param,
        ParamIndex: entry.idx    ?? 0,
        Min:        entry.min    ?? 0,
        Max:        entry.max    ?? 2.5,
        Step:       entry.step   ?? 0.1,
        DefaultVal: 0,
      };
      websocket.send(JSON.stringify({ event:'setSettings', context: uuid, payload: s }));
    }

    document.getElementById('tuneName').addEventListener('change', () => { populateParams(); saveSettings(); });
    document.getElementById('paramLabel').addEventListener('change', saveSettings);
  </script>
</body>
</html>
