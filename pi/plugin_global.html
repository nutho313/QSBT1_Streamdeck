<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>QSBT1 Global Settings</title>
  <link rel="stylesheet" href="sdpi.css"/>
</head>
<body>
  <div class="sdpi-wrapper">

    <div class="sdpi-heading">QS-BT1 Device</div>

    <div type="field" class="sdpi-item">
      <div class="sdpi-item-label">IP Address</div>
      <input class="sdpi-item-value" id="ip" type="text" placeholder="auto-detected"/>
    </div>

    <div type="field" class="sdpi-item">
      <div class="sdpi-item-label">Port</div>
      <input class="sdpi-item-value" id="port" type="number" value="8081"/>
    </div>

    <div type="field" class="sdpi-item">
      <div class="sdpi-item-label"></div>
      <button class="sdpi-item-value" onclick="detectIp()">🔍 Auto-detect IP</button>
    </div>

  </div>

  <script>
    var websocket, uuid, globalSettings = {};

    function connectElgatoStreamDeckSocket(port, pluginUUID, registerEvent, info) {
      uuid = pluginUUID;
      websocket = new WebSocket('ws://127.0.0.1:' + port);
      websocket.onopen = () => {
        websocket.send(JSON.stringify({ event: registerEvent, uuid }));
        websocket.send(JSON.stringify({ event: 'getGlobalSettings', context: uuid }));
      };
      websocket.onmessage = (evt) => {
        const msg = JSON.parse(evt.data);
        if (msg.event === 'didReceiveGlobalSettings') {
          globalSettings = msg.payload.settings || {};
          document.getElementById('ip').value   = globalSettings.IpAddress || '';
          document.getElementById('port').value = globalSettings.Port      || 8081;
        }
      };
    }

    function save() {
      globalSettings.IpAddress = document.getElementById('ip').value;
      globalSettings.Port      = parseInt(document.getElementById('port').value) || 8081;
      websocket.send(JSON.stringify({
        event:   'setGlobalSettings',
        context: uuid,
        payload: globalSettings
      }));
    }

    function detectIp() {
      // Tente de détecter l'IP via WebRTC (fonctionne localement)
      try {
        const pc = new RTCPeerConnection({ iceServers: [] });
        pc.createDataChannel('');
        pc.createOffer().then(o => pc.setLocalDescription(o));
        pc.onicecandidate = (ice) => {
          if (!ice || !ice.candidate || !ice.candidate.candidate) return;
          const match = /(\d+\.\d+\.\d+\.\d+)/.exec(ice.candidate.candidate);
          if (match && !match[1].startsWith('127.')) {
            document.getElementById('ip').value = match[1];
            pc.close();
            save();
          }
        };
      } catch(e) {
        alert('Auto-detect failed. Please enter the IP manually.');
      }
    }

    document.addEventListener('change', save);
  </script>
</body>
</html>
