<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>QSBT1 Settings</title>
  <style>
    :root { --o: #FD890D; --b: #5DB3E2; --bg: #1a1a1a; --dim: #888; --sep: #333; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--o); font-family: 'Arial Narrow', Arial, sans-serif; font-size: 12px; }
    .wrap { padding: 12px 10px; }

    /* Branding */
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .brand img { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--o); }
    .brand-info { line-height: 1.6; }
    .brand-name { color: var(--o); font-size: 13px; font-weight: bold; letter-spacing: 1px; }
    .brand-links { display: flex; gap: 8px; margin-top: 2px; }
    .brand-links a { font-size: 10px; text-decoration: none; cursor: pointer; }
    .brand-links a.orange { color: var(--o); }
    .brand-links a.blue   { color: var(--b); }

    /* Section title */
    .sep { border: none; border-top: 1px solid var(--sep); margin: 10px 0; }
    .section-title { color: var(--o); font-size: 11px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }

    /* Rows */
    .row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .label { color: var(--o); font-size: 10px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; min-width: 65px; flex-shrink: 0; }
    input { flex: 1; background: #111; border: 1px solid var(--b); border-radius: 3px; color: var(--b); font-size: 11px; padding: 4px 7px; outline: none; }
    input:focus { border-color: var(--o); color: var(--o); }
    input[type=number] { max-width: 75px; flex: none; }

    /* Buttons */
    .btn { background: #111; border-radius: 3px; font-size: 10px; padding: 4px 10px; cursor: pointer; flex: 1; }
    .btn.orange { border: 1px solid var(--o); color: var(--o); }
    .btn.orange:hover { background: #2a1800; }
    .btn.blue   { border: 1px solid var(--b); color: var(--b); }
    .btn.blue:hover   { background: #001a2a; }

    /* Status */
    .status { font-size: 10px; color: var(--dim); min-height: 14px; margin-top: 2px; }
    .status.ok  { color: #4caf50; }
    .status.err { color: #f44336; }

    /* Desc */
    .desc { color: var(--dim); font-size: 10px; line-height: 1.7; }
    .desc .o { color: var(--o); font-weight: bold; }
    .desc .b { color: var(--b); }
  </style>
</head>
<body>
<div class="wrap">

  <!-- Branding -->
  <div class="brand">
    <img id="avatar" src="https://avatars.githubusercontent.com/u/268033363?v=4" alt="nutho313"/>
    <div class="brand-info">
      <div class="brand-name">nutho313 QSBT1</div>
      <div class="brand-links">
        <a class="orange" onclick="openUrl('https://www.nutho313.ch')">🌐 nutho313.ch</a>
        <span style="color:var(--dim)">·</span>
        <a class="blue" onclick="openUrl('https://ko-fi.com/nutho313')">☕ Ko-fi</a>
      </div>
    </div>
  </div>

  <hr class="sep"/>
  <div class="section-title">QS-BT1 Device</div>

  <div class="row">
    <span class="label">IP Address</span>
    <input id="ip" type="text" placeholder="auto-detected"/>
  </div>

  <div class="row">
    <span class="label">Port</span>
    <input id="port" type="number" value="8081"/>
  </div>

  <div class="row">
    <span class="label"></span>
    <button class="btn orange" onclick="detectIp()">🔍 Auto-detect</button>
    <button class="btn blue"   onclick="testConnection()">⚡ Test</button>
  </div>

  <div class="status" id="st"></div>

  <hr class="sep"/>

  <div class="row">
    <span class="label">Web UI</span>
    <button class="btn blue" onclick="openWebInterface()">🌐 Open Web Interface</button>
  </div>

  <hr class="sep"/>

  <div class="desc">
    IP = address of <span class="o">this PC</span> on the sim network.<br/>
    Settings apply to <span class="o">all buttons</span>.
  </div>

</div>
<script>
var websocket, uuid, gs = {};

function connectElgatoStreamDeckSocket(port, pluginUUID, registerEvent, info) {
  uuid = pluginUUID;
  websocket = new WebSocket('ws://127.0.0.1:' + port);
  websocket.onopen = () => {
    websocket.send(JSON.stringify({ event: registerEvent, uuid }));
    websocket.send(JSON.stringify({ event: 'getGlobalSettings', context: uuid }));
  };
  websocket.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if (msg.event === 'didReceiveGlobalSettings') {
      gs = msg.payload.settings || {};
      document.getElementById('ip').value   = gs.IpAddress || '';
      document.getElementById('port').value = gs.Port      || 8081;
    }
  };
}

function save() {
  gs.IpAddress = document.getElementById('ip').value.trim();
  gs.Port      = parseInt(document.getElementById('port').value) || 8081;
  websocket.send(JSON.stringify({ event: 'setGlobalSettings', context: uuid, payload: gs }));
}

function detectIp() {
  const st = document.getElementById('st');
  st.className = 'status'; st.textContent = 'Detecting...';
  try {
    const pc = new RTCPeerConnection({ iceServers: [] });
    pc.createDataChannel('');
    pc.createOffer().then(o => pc.setLocalDescription(o));
    pc.onicecandidate = ice => {
      if (!ice?.candidate?.candidate) return;
      const m = /(\d+\.\d+\.\d+\.\d+)/.exec(ice.candidate.candidate);
      if (m && !m[1].startsWith('127.')) {
        document.getElementById('ip').value = m[1];
        pc.close(); save();
        st.className = 'status ok';
        st.textContent = '✓ IP detected: ' + m[1];
      }
    };
    setTimeout(() => {
      if (st.textContent === 'Detecting...') {
        st.className = 'status err';
        st.textContent = 'Not found — enter manually';
      }
    }, 3000);
  } catch(e) {
    st.className = 'status err'; st.textContent = 'Failed — enter manually';
  }
}

async function testConnection() {
  save();
  const ip = document.getElementById('ip').value.trim();
  const port = document.getElementById('port').value;
  const st = document.getElementById('st');
  st.className = 'status'; st.textContent = 'Testing...';
  try {
    const r = await fetch(`http://${ip}:${port}/api/profilesInstalled`, { signal: AbortSignal.timeout(3000) });
    if (r.ok) {
      const d = await r.json();
      const n = (d.profiles || d || []).length;
      st.className = 'status ok';
      st.textContent = `✓ Connected — ${n} profile(s)`;
    } else {
      st.className = 'status err'; st.textContent = `✗ HTTP ${r.status}`;
    }
  } catch(e) {
    st.className = 'status err'; st.textContent = '✗ No response — check IP/Port';
  }
}

function openWebInterface() {
  const ip   = document.getElementById('ip').value.trim();
  const port = document.getElementById('port').value;
  openUrl(`http://${ip}:${port}`);
}

function openUrl(url) {
  if (websocket) websocket.send(JSON.stringify({ event: 'openUrl', payload: { url } }));
}

document.addEventListener('change', save);
</script>
</body>
</html>
