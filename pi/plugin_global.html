<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>QSBT1 Settings</title>
  <style>
    :root { --o: #FD890D; --b: #5DB3E2; --bg: #1a1a1a; --dim: #888; --sep: #333; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--o); font-family: 'Arial Narrow', Arial, sans-serif; font-size: 12px; }
    .wrap { padding: 12px 10px; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .brand img { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--o); }
    .brand-info { line-height: 1.6; }
    .brand-name { color: var(--o); font-size: 13px; font-weight: bold; letter-spacing: 1px; }
    .brand-links { display: flex; gap: 8px; margin-top: 2px; }
    .brand-links a { font-size: 10px; text-decoration: none; cursor: pointer; }
    .brand-links a.o { color: var(--o); }
    .brand-links a.b { color: var(--b); }
    .sep { border: none; border-top: 1px solid var(--sep); margin: 10px 0; }
    .section-title { color: var(--o); font-size: 11px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
    .row { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
    .label { color: var(--o); font-size: 10px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; min-width: 65px; flex-shrink: 0; }
    input { flex: 1; background: #111; border-radius: 3px; color: var(--b); font-size: 11px; padding: 4px 7px; outline: none; transition: border-color 0.2s; }
    input.pending  { border: 1px solid var(--b); color: var(--b); }
    input.applied  { border: 1px solid var(--o); color: var(--o); }
    input[type=number] { max-width: 75px; flex: none; }
    .btn { background: #111; border-radius: 3px; font-size: 10px; padding: 4px 8px; cursor: pointer; }
    .btn.o { border: 1px solid var(--o); color: var(--o); flex: 1; }
    .btn.o:hover { background: #2a1800; }
    .btn.b { border: 1px solid var(--b); color: var(--b); flex: 1; }
    .btn.b:hover { background: #001a2a; }
    .btn.apply { border: 2px solid var(--o); color: var(--o); background: #1a0d00; font-weight: bold; flex: 1; display: none; }
    .btn.apply:hover { background: #3a1800; }
    .btn.apply.visible { display: block; }
    .ip-state { font-size: 10px; min-height: 14px; margin-top: 2px; }
    .ip-state.detected { color: var(--b); }
    .ip-state.applied  { color: var(--o); }
    .status { font-size: 10px; color: var(--dim); min-height: 14px; margin-top: 2px; }
    .status.ok  { color: #4caf50; }
    .status.err { color: #f44336; }
    .desc { color: var(--dim); font-size: 10px; line-height: 1.7; }
    .desc .o { color: var(--o); font-weight: bold; }
    .desc .b { color: var(--b); }
  </style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <img src="https://avatars.githubusercontent.com/u/268033363?v=4" alt="nutho313" onerror="this.style.display='none'"/>
    <div class="brand-info">
      <div class="brand-name">nutho313 QSBT1</div>
      <div class="brand-links">
        <a class="o" onclick="openUrl('https://www.nutho313.ch')">🌐 nutho313.ch</a>
        <span style="color:var(--dim)">·</span>
        <a class="b" onclick="openUrl('https://ko-fi.com/nutho313')">☕ Ko-fi</a>
      </div>
    </div>
  </div>

  <hr class="sep"/>
  <div class="section-title">QS-BT1 Device</div>

  <div class="row">
    <span class="label">IP Address</span>
    <input id="ip" type="text" class="pending" placeholder="e.g. 192.168.1.100" oninput="onIpEdit()"/>
  </div>

  <div class="row">
    <span class="label">Port</span>
    <input id="port" type="number" class="pending" value="8081" oninput="onIpEdit()"/>
  </div>

  <!-- État de l'IP -->
  <div class="ip-state" id="ipState"></div>

  <div class="row" style="margin-top:6px;">
    <button class="btn b" onclick="requestDetect()">🔍 Auto-detect</button>
    <button class="btn apply visible" id="btnApply" onclick="applyIp()">★ Apply</button>
  </div>

  <div class="row">
    <button class="btn b" onclick="testConnection()" style="flex:1;">⚡ Test connection</button>
  </div>

  <div class="status" id="st"></div>

  <hr class="sep"/>

  <div class="row">
    <button class="btn o" onclick="openWebInterface()" style="flex:1;">🌐 Open Web Interface</button>
  </div>

  <hr class="sep"/>

  <div class="desc">
    IP = address of <span class="o">this PC</span> on the sim network.<br/>
    Click <span class="o">★ Apply</span> to push settings to all buttons.
  </div>

</div>
<script>
var websocket, uuid, gs = {};
var _detectedIp = '', _detectedPort = 8081;
var _appliedIp  = '', _appliedPort  = 8081;

function connectElgatoStreamDeckSocket(port, pluginUUID, registerEvent, info) {
  uuid = pluginUUID;
  websocket = new WebSocket('ws://127.0.0.1:' + port);
  websocket.onopen = () => {
    websocket.send(JSON.stringify({ event: registerEvent, uuid }));
    websocket.send(JSON.stringify({ event: 'getGlobalSettings', context: uuid }));
  };
  websocket.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);

    if (msg.event === 'didReceiveGlobalSettings') {
      gs = msg.payload.settings || {};
      if (gs.IpAddress) {
        _appliedIp   = gs.IpAddress;
        _appliedPort = gs.Port || 8081;
        setAppliedState(gs.IpAddress, gs.Port || 8081);
      }
    }

    if (msg.event === 'sendToPropertyInspector') {
      const data = msg.payload || {};
      if (data.detectedIp) {
        _detectedIp   = data.detectedIp;
        _detectedPort = data.port || 8081;
        setDetectedState(data.detectedIp, data.port || 8081);
      }
    }
  };
}

function setDetectedState(ip, port) {
  document.getElementById('ip').value        = ip;
  document.getElementById('port').value      = port;
  document.getElementById('ip').className    = 'pending';
  document.getElementById('port').className  = 'pending';
  document.getElementById('ipState').className   = 'ip-state detected';
  document.getElementById('ipState').textContent = '🔵 Detected — click ★ Apply to use';
  document.getElementById('btnApply').className  = 'btn apply visible';
  document.getElementById('st').textContent = '';
}

function setAppliedState(ip, port) {
  document.getElementById('ip').value        = ip;
  document.getElementById('port').value      = port;
  document.getElementById('ip').className    = 'applied';
  document.getElementById('port').className  = 'applied';
  document.getElementById('ipState').className   = 'ip-state applied';
  document.getElementById('ipState').textContent = '★ Applied — ' + ip + ':' + port;
  document.getElementById('btnApply').className  = 'btn apply';
}

function onIpEdit() {
  // Si l'utilisateur édite manuellement, repasser en "pending"
  document.getElementById('ip').className   = 'pending';
  document.getElementById('port').className = 'pending';
  document.getElementById('ipState').className   = 'ip-state detected';
  document.getElementById('ipState').textContent = '🔵 Modified — click ★ Apply to save';
  document.getElementById('btnApply').className  = 'btn apply visible';
}

function applyIp() {
  const ip   = document.getElementById('ip').value.trim();
  const port = parseInt(document.getElementById('port').value) || 8081;
  if (!ip) {
    document.getElementById('st').className   = 'status err';
    document.getElementById('st').textContent = 'Enter an IP address first';
    return;
  }
  gs.IpAddress = ip;
  gs.Port      = port;
  _appliedIp   = ip;
  _appliedPort = port;
  websocket.send(JSON.stringify({ event: 'setGlobalSettings', context: uuid, payload: gs }));
  setAppliedState(ip, port);
  document.getElementById('st').className   = 'status ok';
  document.getElementById('st').textContent = '✓ Settings applied to all buttons';
}

function requestDetect() {
  const st = document.getElementById('st');
  st.className = 'status'; st.textContent = 'Detecting...';
  document.getElementById('ipState').className   = 'ip-state';
  document.getElementById('ipState').textContent = '';
  websocket.send(JSON.stringify({ event: 'getGlobalSettings', context: uuid }));
  setTimeout(() => {
    if (st.textContent === 'Detecting...') {
      st.className = 'status err';
      st.textContent = 'Could not detect — enter IP manually';
    }
  }, 3000);
}

async function testConnection() {
  const ip   = document.getElementById('ip').value.trim();
  const port = document.getElementById('port').value;
  const st   = document.getElementById('st');
  if (!ip) { st.className='status err'; st.textContent='Enter an IP first'; return; }
  st.className = 'status'; st.textContent = 'Testing...';
  try {
    const r = await fetch(`http://${ip}:${port}/api/profilesInstalled`, { signal: AbortSignal.timeout(3000) });
    if (r.ok) {
      const d = await r.json();
      const n = (d.profiles || d || []).length;
      st.className = 'status ok';
      st.textContent = `✓ Connected — ${n} profile(s) found`;
    } else {
      st.className = 'status err'; st.textContent = `✗ HTTP ${r.status}`;
    }
  } catch(e) {
    st.className = 'status err'; st.textContent = '✗ No response — check IP/Port';
  }
}

function openWebInterface() {
  const ip   = document.getElementById('ip').value.trim();
  const port = document.getElementById('port').value;
  openUrl(`http://${ip}:${port}`);
}

function openUrl(url) {
  if (websocket) websocket.send(JSON.stringify({ event: 'openUrl', payload: { url } }));
}
</script>
</body>
</html>
