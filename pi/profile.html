<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Activate Profile</title>
  <link rel="stylesheet" href="sdpi.css"/>
</head>
<body>
  <div class="sdpi-wrapper">
    <div class="sdpi-heading">Connection</div>
    <div type="field" class="sdpi-item">
      <div class="sdpi-item-label">IP Address</div>
      <input class="sdpi-item-value" id="ip" type="text" value="192.168.8.131"/>
    </div>
    <div type="field" class="sdpi-item">
      <div class="sdpi-item-label">Port</div>
      <input class="sdpi-item-value" id="port" type="number" value="8081"/>
    </div>

    <div class="sdpi-heading">Profile</div>
    <div type="field" class="sdpi-item">
      <div class="sdpi-item-label">Profile ID</div>
      <input class="sdpi-item-value" id="profileId" type="number" value="276"/>
    </div>
    <div type="field" class="sdpi-item">
      <div class="sdpi-item-label">Profile Name</div>
      <input class="sdpi-item-value" id="profileName" type="text" value="My Profile"/>
    </div>
  </div>
  <script>
    var websocket, uuid, settings = {};

    function connectElgatoStreamDeckSocket(port, pluginUUID, registerEvent, info, actionInfo_) {
      uuid = pluginUUID;
      settings = JSON.parse(actionInfo_).payload.settings || {};
      websocket = new WebSocket('ws://127.0.0.1:' + port);
      websocket.onopen = () => {
        websocket.send(JSON.stringify({ event: registerEvent, uuid }));
        document.getElementById('ip').value          = settings.IpAddress   || '192.168.8.131';
        document.getElementById('port').value        = settings.Port        || 8081;
        document.getElementById('profileId').value   = settings.ProfileId   || 276;
        document.getElementById('profileName').value = settings.ProfileName || 'My Profile';
      };
    }

    function save() {
      websocket.send(JSON.stringify({ event:'setSettings', context: uuid, payload: {
        IpAddress:   document.getElementById('ip').value,
        Port:        parseInt(document.getElementById('port').value),
        ProfileId:   parseInt(document.getElementById('profileId').value),
        ProfileName: document.getElementById('profileName').value,
      }}));
    }

    document.addEventListener('change', save);
  </script>
</body>
</html>
