<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Profile</title>
  <style>
    :root { --o: #FD890D; --b: #5DB3E2; --bg: #1a1a1a; --dim: #888; --sep: #333; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--o); font-family: 'Arial Narrow', Arial, sans-serif; font-size: 12px; }
    .wrap { padding: 12px 10px; }
    .title { color: var(--o); font-size: 11px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px solid var(--o); }
    .row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .label { color: var(--o); font-size: 10px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; min-width: 65px; flex-shrink: 0; }
    select { flex: 1; background: #111; border: 1px solid var(--b); border-radius: 3px; color: var(--b); font-size: 11px; padding: 4px 7px; outline: none; }
    select:focus { border-color: var(--o); color: var(--o); }
    .btn { background: #111; border-radius: 3px; font-size: 10px; padding: 4px 10px; cursor: pointer; flex: 1; }
    .btn.orange { border: 1px solid var(--o); color: var(--o); }
    .btn.orange:hover { background: #2a1800; }
    .btn.blue { border: 1px solid var(--b); color: var(--b); }
    .btn.blue:hover { background: #001a2a; }
    .btn.green { border: 1px solid #4caf50; color: #4caf50; }
    .btn.green:hover { background: #001a00; }
    .sep { border: none; border-top: 1px solid var(--sep); margin: 10px 0; }
    .status { font-size: 10px; color: var(--dim); min-height: 14px; margin-top: 2px; }
    .status.ok  { color: #4caf50; }
    .status.err { color: #f44336; }
    .desc { color: var(--dim); font-size: 10px; line-height: 1.7; }
    .desc .o { color: var(--o); font-weight: bold; }
    .desc .b { color: var(--b); }
  </style>
</head>
<body>
<div class="wrap">

  <div class="title">Profile</div>

  <div class="row">
    <span class="label">Profile</span>
    <select id="profileId">
      <option value="">-- click Refresh --</option>
    </select>
  </div>

  <div class="row">
    <span class="label"></span>
    <button class="btn blue"  onclick="loadProfiles()">🔄 Refresh</button>
    <button class="btn green" onclick="activateSelected()">▶ Activate</button>
  </div>

  <div class="status" id="st"></div>

  <hr class="sep"/>

  <div class="desc">
    <span class="o">Press button</span> → next profile in rotation<br/>
    <span class="b">IP &amp; Port</span> → configure in Settings button
  </div>

</div>
<script>
var websocket, uuid, settings = {}, globalSettings = {};

function connectElgatoStreamDeckSocket(port, pluginUUID, registerEvent, info, actionInfo_) {
  uuid     = pluginUUID;
  settings = JSON.parse(actionInfo_).payload.settings || {};
  websocket = new WebSocket('ws://127.0.0.1:' + port);
  websocket.onopen = () => {
    websocket.send(JSON.stringify({ event: registerEvent, uuid }));
    websocket.send(JSON.stringify({ event: 'getGlobalSettings', context: uuid }));
  };
  websocket.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if (msg.event === 'didReceiveGlobalSettings') {
      globalSettings = msg.payload.settings || {};
      loadProfiles();
    }
  };
}

async function loadProfiles() {
  const ip   = globalSettings.IpAddress || '192.168.8.131';
  const port = globalSettings.Port      || 8081;
  const sel  = document.getElementById('profileId');
  const st   = document.getElementById('st');
  sel.innerHTML = '<option>Loading...</option>';
  st.className = 'status'; st.textContent = '';
  try {
    const r = await fetch(`http://${ip}:${port}/api/profilesInstalled`, { signal: AbortSignal.timeout(3000) });
    const d = await r.json();
    const profiles = d.profiles || d || [];
    sel.innerHTML = '';
    profiles.forEach(p => {
      const o = document.createElement('option');
      o.value = p.id;
      o.text  = `${p.is_active ? '★ ' : ''}${p.name} (ID ${p.id})`;
      if (p.id == settings.StartProfileId || (p.is_active && !settings.StartProfileId))
        o.selected = true;
      sel.appendChild(o);
    });
    st.className = 'status ok'; st.textContent = `✓ ${profiles.length} profile(s)`;
    save();
  } catch(e) {
    sel.innerHTML = '<option value="">Error — check Settings button IP/Port</option>';
    st.className = 'status err'; st.textContent = '✗ Cannot reach device';
  }
}

async function activateSelected() {
  const ip   = globalSettings.IpAddress || '192.168.8.131';
  const port = globalSettings.Port      || 8081;
  const pid  = document.getElementById('profileId').value;
  const st   = document.getElementById('st');
  if (!pid) return;
  st.className = 'status'; st.textContent = 'Activating...';
  try {
    const r = await fetch(`http://${ip}:${port}/api/activateProfile`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ profileId: parseInt(pid) }),
      signal: AbortSignal.timeout(3000)
    });
    if (r.ok) {
      st.className = 'status ok'; st.textContent = '✓ Profile activated';
      setTimeout(loadProfiles, 800);
    } else {
      st.className = 'status err'; st.textContent = `✗ HTTP ${r.status}`;
    }
  } catch(e) {
    st.className = 'status err'; st.textContent = '✗ Failed to activate';
  }
}

function save() {
  const pid = parseInt(document.getElementById('profileId').value) || 0;
  websocket.send(JSON.stringify({ event: 'setSettings', context: uuid, payload: { StartProfileId: pid } }));
}

document.addEventListener('change', save);
</script>
</body>
</html>
