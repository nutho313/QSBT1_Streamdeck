<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Show Status</title>
  <link rel="stylesheet" href="sdpi.css"/>
</head>
<body>
  <div class="sdpi-wrapper">
    <div class="sdpi-heading">Connection</div>
    <div type="field" class="sdpi-item">
      <div class="sdpi-item-label">IP Address</div>
      <input class="sdpi-item-value" id="ip" type="text"/>
    </div>
    <div type="field" class="sdpi-item">
      <div class="sdpi-item-label">Port</div>
      <input class="sdpi-item-value" id="port" type="number" value="8081"/>
    </div>
    <div type="field" class="sdpi-item">
      <div class="sdpi-item-label">Profile ID</div>
      <input class="sdpi-item-value" id="profileId" type="number" value="276"/>
    </div>

    <div class="sdpi-heading">Parameter to Display</div>
    <div type="field" class="sdpi-item">
      <div class="sdpi-item-label">Tune Name</div>
      <select class="sdpi-item-value" id="tuneName"></select>
    </div>
    <div type="field" class="sdpi-item">
      <div class="sdpi-item-label">Parameter</div>
      <select class="sdpi-item-value" id="paramLabel"></select>
    </div>
    <div type="field" class="sdpi-item">
      <div class="sdpi-item-label">Tune Group</div>
      <input class="sdpi-item-value" id="tuneGroup" type="number" readonly/>
    </div>
    <div type="field" class="sdpi-item">
      <div class="sdpi-item-label" style="font-size:10px;color:#aaa;">
        Polls device every 3s. Tap button to force refresh.
      </div>
    </div>
  </div>
  <script>
    // Reuse same catalog as adjust.html
    var websocket, uuid, settings = {};

    function connectElgatoStreamDeckSocket(port, pluginUUID, registerEvent, info, actionInfo_) {
      uuid = pluginUUID;
      settings = JSON.parse(actionInfo_).payload.settings || {};
      websocket = new WebSocket('ws://127.0.0.1:' + port);
      websocket.onopen = () => {
        websocket.send(JSON.stringify({ event: registerEvent, uuid }));
        loadSettings();
      };
    }

    const catalog = [
      {tune:"Braking",group:12,param:"Gain",idx:0},
      {tune:"Braking",group:12,param:"Sharpness",idx:1},
      {tune:"Braking",group:12,param:"Deadzone",idx:2},
      {tune:"Acceleration",group:12,param:"Gain",idx:0},
      {tune:"Acceleration",group:12,param:"Sharpness",idx:1},
      {tune:"Sideways Acceleration",group:12,param:"Gain",idx:0},
      {tune:"Centrifugal Force",group:12,param:"Gain",idx:0},
      {tune:"Centrifugal Force",group:12,param:"Sharpness",idx:1},
      {tune:"Bounds",group:12,param:"Neutral",idx:0},
      {tune:"Bounds",group:12,param:"Maximum",idx:1},
      {tune:"Vertical G-Force",group:12,param:"Gain",idx:0},
      {tune:"Side Slip",group:12,param:"Threshold",idx:0},
      {tune:"Side Slip",group:12,param:"Intensity",idx:2},
      {tune:"Road Harshness",group:12,param:"Gain",idx:0},
      {tune:"Pre-Impact Protection",group:12,param:"Long.",idx:0},
      {tune:"Violent Movement Threshold",group:2,param:"Threshold",idx:0},
      {tune:"Rev Limiter",group:17,param:"Frequency",idx:0},
      {tune:"ABS Active",group:17,param:"Frequency",idx:0},
    ];

    function getUniqueTunes() { return [...new Set(catalog.map(c => c.tune))]; }
    function getParamsForTune(t) { return catalog.filter(c => c.tune === t); }

    function loadSettings() {
      document.getElementById('ip').value        = settings.IpAddress  || '192.168.8.131';
      document.getElementById('port').value      = settings.Port       || 8081;
      document.getElementById('profileId').value = settings.ProfileId  || 276;
      const sel = document.getElementById('tuneName');
      sel.innerHTML = '';
      getUniqueTunes().forEach(t => {
        const o = document.createElement('option');
        o.value = t; o.text = t;
        if (t === settings.TuneName) o.selected = true;
        sel.appendChild(o);
      });
      populateParams();
    }

    function populateParams() {
      const tune = document.getElementById('tuneName').value;
      const sel  = document.getElementById('paramLabel');
      sel.innerHTML = '';
      getParamsForTune(tune).forEach(p => {
        const o = document.createElement('option');
        o.value = p.param; o.text = p.param;
        if (p.param === settings.ParamLabel) o.selected = true;
        sel.appendChild(o);
      });
      updateGroup();
    }

    function updateGroup() {
      const tune  = document.getElementById('tuneName').value;
      const param = document.getElementById('paramLabel').value;
      const entry = catalog.find(c => c.tune === tune && c.param === param);
      if (entry) document.getElementById('tuneGroup').value = entry.group;
    }

    function save() {
      const tune  = document.getElementById('tuneName').value;
      const param = document.getElementById('paramLabel').value;
      const entry = catalog.find(c => c.tune === tune && c.param === param) || {};
      websocket.send(JSON.stringify({ event:'setSettings', context: uuid, payload: {
        IpAddress:  document.getElementById('ip').value,
        Port:       parseInt(document.getElementById('port').value),
        ProfileId:  parseInt(document.getElementById('profileId').value),
        TuneName:   tune,
        TuneGroup:  entry.group ?? 12,
        ParamLabel: param,
        ParamIndex: entry.idx   ?? 0,
      }}));
    }

    document.addEventListener('change', () => { populateParams(); updateGroup(); save(); });
    document.getElementById('tuneName').addEventListener('change', () => { populateParams(); save(); });
  </script>
</body>
</html>
